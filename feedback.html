<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - ConnectX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
{% include '_support_widget.html' %}
<div class="flow-shell"><main class="flow-card feedback-page">
    <p class="eyebrow">YOUR VOICE MATTERS</p>
    <h1>Tell us about ConnectX</h1>
    <p class="intro">Help us make booking and tracking services better.</p>
    {% if sent %}<div class="paid-banner">Thanks for your feedback.</div>{% endif %}
    <form method="POST" class="feedback-form">
        <label for="message">Your feedback</label>
        <textarea id="message" name="message" rows="7" placeholder="What can we improve?" required></textarea>
        <button class="primary-action" type="submit">Send feedback <span>-></span></button>
    </form>
</main></div>
</body>
</html>
