<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <defs>
    <!-- Gradient for Top-Right wing -->
    <linearGradient id="wingTopRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062FF"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>

    <!-- Gradient for Main Diagonal (top-left to bottom-right) -->
    <linearGradient id="mainDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="60%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>

    <!-- Gradient for Bottom-Left wing -->
    <linearGradient id="wingBottomLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005BFF"/>
      <stop offset="100%" stop-color="#268BFF"/>
    </linearGradient>

    <!-- Gradient for Bottom-Right wing -->
    <linearGradient id="wingBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#00E1FF"/>
    </linearGradient>
  </defs>

  <!-- "connect" text in deep dark navy bold typography -->
  <text x="12" y="93" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" 
        font-size="88" 
        font-weight="900" 
        letter-spacing="-3.5px" 
        fill="#040b22">connect</text>

  <!-- Stylized Geometric Folded Ribbon "X" -->
  <g id="logo-symbol-x" transform="translate(385, 14)">
    <!-- Top-Right Wing (Angled rhomboid ribbon) -->
    <polygon points="46,14 90,14 62,56 36,46" fill="url(#wingTopRight)" />

    <!-- Main Diagonal Ribbon (Top-Left to Bottom-Right) -->
    <polygon points="12,18 46,18 92,90 58,90" fill="url(#mainDiagonal)" />

    <!-- Center Fold Overlap Shadow/Facet -->
    <polygon points="36,46 54,42 66,62 48,66" fill="#004cd8" opacity="0.85" />

    <!-- Bottom-Left Wing Ribbon -->
    <polygon points="8,90 42,90 54,64 30,52" fill="url(#wingBottomLeft)" />

    <!-- Bottom-Right Wing Accent -->
    <polygon points="58,90 92,90 80,70 52,58" fill="url(#wingBottomRight)" />
  </g>
</svg>
