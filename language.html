<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Language - ConnectX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="flow-shell">
    <header class="flow-header">
        <span class="brand-mark">CX</span>
        <span>ConnectX</span>
        <span class="step-count">WELCOME</span>
    </header>
    <main class="flow-card language-page">
        <div class="language-symbol" aria-hidden="true">Aa</div>
        <p class="eyebrow">WELCOME BACK, {{ session.get('name', 'THERE')|upper }}</p>
        <h1>Choose your language</h1>
        <p class="intro">Select your preferred language before continuing to your account.</p>
        {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
        <form method="POST" class="language-form">
            <fieldset>
                <legend>Preferred language</legend>
                {% for language in languages %}
                <label class="language-option">
                    <input type="radio" name="language" value="{{ language }}" {% if loop.first %}checked{% endif %}>
                    <span>{{ language }}</span>
                    <strong aria-hidden="true">&#10003;</strong>
                </label>
                {% endfor %}
            </fieldset>
            <button class="primary-action" type="submit">Continue <span>-></span></button>
        </form>
    </main>
</div>
</body>
</html>
